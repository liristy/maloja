name: Build and release Docker image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified image to Docker Hub
        type: boolean
        default: true
      repository:
        description: Docker Hub namespace/repository (optional override)
        type: string
        required: false
  push:
    tags:
      - 'v*'
      - 'docker-v*'
      - 'runaction-docker'

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Run regression tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Prepare image tags
        id: image
        env:
          DOCKER_REPOSITORY: ${{ inputs.repository || vars.DOCKERHUB_REPOSITORY }}
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          repository="${DOCKER_REPOSITORY:-${DOCKER_USERNAME:-$GITHUB_REPOSITORY_OWNER}/maloja}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$repository:$version"
            echo "$repository:latest"
            echo "$repository:sha-${GITHUB_SHA:0:12}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4.2.0
      - uses: docker/setup-buildx-action@v4.2.0

      - name: Build local image for smoke testing
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          load: true
          tags: maloja:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container startup and WebP support
        run: |
          docker run --rm --entrypoint /venv/bin/python \
            -e MALOJA_DATA_DIRECTORY=/tmp/maloja-test maloja:smoke \
            -c "from PIL import features; assert features.check('webp'); from maloja import server; print('WebP and server imports OK')"
          docker run -d --name maloja-smoke -p 127.0.0.1:42010:42010 \
            -e MALOJA_DATA_DIRECTORY=/data \
            -e MALOJA_FORCE_PASSWORD="$(cat /proc/sys/kernel/random/uuid)" maloja:smoke
          trap 'docker logs maloja-smoke; docker rm -f maloja-smoke' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:42010/ -o /tmp/maloja-home.html; then
              grep -q 'Top Artists' /tmp/maloja-home.html && exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Log in to Docker Hub
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build and publish AMD64 and ARM64 images
        id: publish
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published manifest
        if: steps.publish.outcome == 'success'
        env:
          IMAGE: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.version }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE"
          echo "Published: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Update Docker Hub description
        if: steps.publish.outcome == 'success'
        uses: peter-evans/dockerhub-description@v5.0.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
          repository: ${{ steps.image.outputs.repository }}
          short-description: Maloja with local Navidrome artwork and compressed covers
